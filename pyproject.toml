[project]
name = "usub"
version = "0.1.0"
description = "Unified job submission for parallel execution on clusters"
readme = "README.md"
authors = [{ name = "Ally Dunham", email = "ad44@sanger.ac.uk" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
usub = "usub.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["benchmark: end-to-end timing checks (deselect with -m \"not benchmark\")"]
